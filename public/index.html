<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>脊柱侧弯门诊预约</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── Header ──────────────────────────────────────────────── -->
  <header class="app-header">
    <div class="header-icon">🏥</div>
    <h1>脊柱侧弯门诊预约</h1>
  </header>

  <!-- ── Tab Bar ─────────────────────────────────────────────── -->
  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="booking">📅 预约挂号</button>
    <button class="tab-btn" data-tab="myappt">📋 我的预约</button>
    <button class="tab-btn" data-tab="admin">🔒 管理</button>
  </nav>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!-- TAB 1: 预约挂号                                             -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <main id="tab-booking" class="tab-content active">

    <!-- Calendar -->
    <div class="calendar-card">
      <div class="calendar-header">
        <button id="cal-prev" class="cal-nav-btn">◀</button>
        <span id="cal-title" class="cal-title"></span>
        <button id="cal-next" class="cal-nav-btn">▶</button>
      </div>
      <div class="calendar-weekdays">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>
      <div id="cal-grid" class="calendar-grid"></div>
      <div class="calendar-legend">
        <span><i class="dot green"></i> 可预约</span>
        <span><i class="dot gray"></i> 已约满</span>
        <span><i class="dot none"></i> 不可约</span>
      </div>
    </div>

    <!-- Selected date slots -->
    <div id="slots-card" class="slots-card" style="display:none;">
      <div class="card-title" id="slots-date-title"></div>
      <div id="slots-list" class="slots-list"></div>
    </div>

    <!-- Booking form modal -->
    <div id="form-overlay" class="modal-overlay" style="display:none;">
      <div class="modal-box">
        <div class="modal-header">
          <h3>确认预约信息</h3>
          <button id="form-close" class="close-btn">&times;</button>
        </div>
        <div class="modal-body">
          <div class="info-row">
            <span class="info-label">📅 日期</span>
            <span id="confirm-date"></span>
          </div>
          <div class="info-row">
            <span class="info-label">🕐 时间段</span>
            <span id="confirm-slot"></span>
          </div>
          <div class="form-group">
            <label for="input-name">👤 姓名</label>
            <input type="text" id="input-name" placeholder="请输入姓名" maxlength="20" autocomplete="name">
          </div>
          <div class="form-group">
            <label for="input-phone">📱 手机号</label>
            <input type="tel" id="input-phone" placeholder="请输入11位手机号" maxlength="11" autocomplete="tel">
          </div>
          <button id="btn-submit" class="btn-primary">确认预约</button>
          <p class="form-hint">同一时间段按姓名检测重复，同一姓名不可重复预约同一时段</p>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast" style="display:none;"></div>
  </main>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!-- TAB 2: 我的预约                                             -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <main id="tab-myappt" class="tab-content">

    <!-- Lookup -->
    <div class="lookup-card">
      <div class="form-group">
        <label for="lookup-phone">📱 请输入手机号查询预约</label>
        <input type="tel" id="lookup-phone" placeholder="输入11位手机号" maxlength="11">
      </div>
      <button id="btn-lookup" class="btn-primary">查询预约</button>
    </div>

    <!-- Results -->
    <div id="myappt-list" class="appt-list"></div>

    <!-- Modify modal -->
    <div id="modify-overlay" class="modal-overlay" style="display:none;">
      <div class="modal-box">
        <div class="modal-header">
          <h3>修改预约</h3>
          <button id="modify-close" class="close-btn">&times;</button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="modify-id">
          <div class="form-group">
            <label>📅 新日期</label>
            <input type="date" id="modify-date">
          </div>
          <div class="form-group">
            <label>🕐 新时间段</label>
            <select id="modify-slot"></select>
          </div>
          <div class="form-group">
            <label>👤 姓名</label>
            <input type="text" id="modify-name" maxlength="20">
          </div>
          <div class="form-group">
            <label>📱 手机号</label>
            <input type="tel" id="modify-phone" maxlength="11">
          </div>
          <button id="btn-modify-confirm" class="btn-primary">确认修改</button>
        </div>
      </div>
    </div>
  </main>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!-- TAB 3: 管理                                                 -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <main id="tab-admin" class="tab-content">

    <!-- Password gate -->
    <div id="admin-gate" class="admin-card">
      <div style="text-align:center;padding:12px 0;">
        <div style="font-size:40px;margin-bottom:8px;">🔒</div>
        <p style="font-size:15px;font-weight:600;color:var(--gray-700);">管理员验证</p>
        <p style="font-size:13px;color:var(--gray-400);margin-top:4px;">请输入管理员密码查看预约记录</p>
      </div>
      <div class="form-group">
        <input type="password" id="admin-password" placeholder="请输入管理员密码" maxlength="20">
      </div>
      <button id="btn-admin-verify" class="btn-primary">验证进入</button>
      <p id="admin-error" style="text-align:center;color:var(--red);font-size:13px;margin-top:8px;display:none;"></p>
    </div>

    <!-- Admin content (hidden until verified) -->
    <div id="admin-content" style="display:none;">
      <div class="admin-card">
        <div class="form-group">
          <label>📅 选择日期查看预约</label>
          <div class="date-picker-row">
            <input type="text" id="admin-date" readonly placeholder="点击右侧日历选择">
            <button id="btn-admin-cal" class="btn-cal" title="选择日期">📅</button>
          </div>
        </div>
        <button id="btn-admin-query" class="btn-primary">查询</button>
        <button id="btn-admin-all" class="btn-outline" style="margin-top:8px;">查看全部记录</button>
        <button id="btn-admin-logout" class="btn-outline" style="margin-top:4px;color:var(--red);border-color:var(--red-bg);">退出管理</button>
      </div>

      <!-- Admin calendar popup -->
      <div id="admin-cal-overlay" class="modal-overlay" style="display:none;">
        <div class="modal-box">
          <div class="modal-header">
            <h3>选择日期</h3>
            <button id="admin-cal-close" class="close-btn">&times;</button>
          </div>
          <div class="modal-body">
            <div class="calendar-header">
              <button id="admin-cal-prev" class="cal-nav-btn">◀</button>
              <span id="admin-cal-title" class="cal-title"></span>
              <button id="admin-cal-next" class="cal-nav-btn">▶</button>
            </div>
            <div class="calendar-weekdays">
              <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
            </div>
            <div id="admin-cal-grid" class="calendar-grid"></div>
          </div>
        </div>
      </div>

      <div id="admin-table-wrap" class="admin-table-wrap"></div>
    </div>
  </main>

  <!-- ── Footer ───────────────────────────────────────────────── -->
  <footer class="app-footer">
    脊柱侧弯门诊 · 预约时间 8:30-11:30 / 15:00-17:00
  </footer>

  <script src="app.js"></script>
</body>
</html>
